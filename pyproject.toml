[build-system]
requires = ["hatchling>=1.25,<1.33"]
build-backend = "hatchling.build"

[project]
name = "repo-doctor-levuskin"
version = "1.0.0"
description = "CLI utility for auditing and standardizing software repositories"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Никита Денисович Левушкин" }]
keywords = ["cli", "repository", "audit", "github", "gitlab"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.27,<1",
  "Jinja2>=3.1,<4",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "pytest-github-actions-annotate-failures>=0.3,<1",
  "ruff>=0.5,<1",
  "twine>=6,<8",
  "types-PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/Nikita-Levuskin/Repo-Doctor"
Documentation = "https://github.com/Nikita-Levuskin/Repo-Doctor#readme"
Issues = "https://github.com/Nikita-Levuskin/Repo-Doctor/issues"
Source = "https://github.com/Nikita-Levuskin/Repo-Doctor"

[project.scripts]
repo-doctor = "repo_doctor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_doctor"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/demo",
  "/docs",
  "/scripts",
  "/src",
  "/tests",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/config.example.yaml",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["integration: integration-level tests"]

[tool.coverage.run]
branch = true
source = ["repo_doctor"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["repo_doctor"]

[[tool.mypy.overrides]]
module = ["typer.*"]
disallow_untyped_decorators = false

[tool.ruff.lint.per-file-ignores]
"src/repo_doctor/cli.py" = ["B008"]
